[connection]
address = "127.0.0.1:6600"
timeout = 5000

[ui]
# Startup screen: library, queue, search
startup_screen = "library"
enable_mouse = true

# Header display
header_format = "%artist% - %title%"

# Queue columns
queue_columns = ["status", "title", "artist", "album", "time"]

# Color theme (built-in: default, nord, dracula)
theme = "default"

[behavior]
auto_sync_library = true
follow_cursor_in_queue = true
seek_step = 5  # seconds

[keybindings]
# vim-like keybindings (default)
# j = down, k = up, h = left, l = right
# / = search, ? = help
# Space = play/pause, q = quit
